name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker.
      - run: ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # A production build must name the API (vite.config.ts); any https URL does for this check.
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          # A check build, never deployed: placeholder legal details only warn here. deploy.yml doesn't allow them.
          ALLOW_PLACEHOLDER_BUSINESS_DETAILS: 'true'
